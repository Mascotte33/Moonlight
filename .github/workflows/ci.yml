name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint, type-check, and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (including dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: python -m ruff check .

      - name: Mypy (strict)
        run: python -m mypy --strict .

      - name: Pytest (unit tests)
        run: python -m pytest -v

  benchmark:
    name: Performance benchmarks (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (including dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run benchmarks
        # Informational only: report performance data but never block the build.
        continue-on-error: true
        run: |
          python -m pytest --benchmark-only --benchmark-json=benchmark_results.json -v

      - name: Ensure benchmark artifact exists
        if: always()
        run: |
          if [ ! -f benchmark_results.json ]; then
            echo '{}' > benchmark_results.json
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json
