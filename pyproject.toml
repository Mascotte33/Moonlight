[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moonlight"
version = "0.1.0"
description = "Screen-capture automation bot for Tibia (OTS servers)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pyserial>=3.5",
    "mss>=9.0",
    "pytesseract>=0.3.10",
    # 6.0.0 hangs the GUI: a scrollbar redraw recurses without end
    "customtkinter>=5.2,<6",
    "python-xlib>=0.33 ; sys_platform=='linux'",
    # 12x faster capture than mss on Windows (P2, measured live)
    "dxcam>=0.3.0,<0.4 ; sys_platform=='win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["moonlight*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["tools"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
explicit_package_bases = true
mypy_path = "tests/hil"
exclude = ["^tools/"]


[[tool.mypy.overrides]]
module = ["customtkinter", "pytesseract", "Xlib", "Xlib.*", "dxcam.*"]
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: full 200-frame replay (tens of seconds)",
    "safety: safety invariants (T29)",
]
